spring:
    application:
        name: habit-tracker

    # Nạp secrets từ file gitignored (secrets.properties) HOẶC biến môi trường.
    # 'optional:' -> không có file cũng không sao (vd khi dùng env trên server).
    config:
        import: optional:file:./secrets.properties

    datasource:
        url: ${DB_URL:jdbc:postgresql://db.fqvexwqafzdunvyvdzhx.supabase.co:5432/postgres?sslmode=require}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope: openid,email,profile
                        # redirect_uri mặc định của Spring Security: /login/oauth2/code/google
                        # -> phải khai đúng URI này trong Google Cloud Console.

# Token ký RSA (khóa sinh runtime ở KeyConfig) — không còn secret đối xứng.
jwt:
    # Thời hạn access token (giây) — mặc định 1 giờ.
    validDuration: ${JWT_VALID_DURATION:3600}
    # Thời hạn refresh token (giây) — mặc định 30 ngày. Refresh token lưu ở DB (hash), không phải JWT.
    refreshValidDuration: ${JWT_REFRESH_VALID_DURATION:2592000}

app:
    # Nơi frontend nhận lại token sau khi đăng nhập Google xong (backend redirect tới đây kèm ?token=...).
    frontend-oauth2-redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    # Secure=true đòi HTTPS (localhost qua http vẫn được các trình duyệt hiện đại chấp nhận).
    # Đặt false CHỈ khi test qua http trên domain khác localhost — không dùng ở production.
    cookie-secure: ${COOKIE_SECURE:true}
    # Origin DUY NHẤT được phép gọi API kèm cookie (CORS). KHÔNG được để "*" vì
    # trình duyệt chặn credentials:'include' đi kèm wildcard origin.
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
