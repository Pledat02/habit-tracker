spring:
    application:
        name: habit-tracker

    # Nạp secrets từ file gitignored (secrets.properties) HOẶC biến môi trường.
    # 'optional:' -> không có file cũng không sao (vd khi dùng env trên server).
    config:
        import: optional:file:./secrets.properties

    datasource:
        url: ${DB_URL:jdbc:postgresql://db.fqvexwqafzdunvyvdzhx.supabase.co:5432/postgres?sslmode=require}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            # Flyway sở hữu schema giờ. validate: Hibernate CHỈ kiểm entity khớp DB,
            # KHÔNG tự đổi (an toàn hơn update rất nhiều).
            ddl-auto: validate
        # TẮT mặc định: log SQL gây ồn + lộ dữ liệu ở production. Bật khi debug bằng
        # JPA_SHOW_SQL=true (local). format-sql chỉ có tác dụng khi show-sql bật.
        show-sql: ${JPA_SHOW_SQL:false}
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
        # DB Supabase hiện tại đã có sẵn schema (do ddl-auto:update cũ tạo) nhưng chưa có
        # bảng lịch sử flyway -> baseline-on-migrate đánh dấu nó ở V1 (bỏ qua V1), rồi chạy V2+.
        # DB MỚI (rỗng) sẽ chạy toàn bộ từ V1.
        baseline-on-migrate: true
        baseline-version: 1

    # SMTP gửi email (password reset). username/password RỖNG -> EmailService tự log link ra
    # console thay vì gửi (dev). Gmail: bật 2FA rồi tạo App Password 16 ký tự, bỏ vào secrets.
    mail:
        host: ${MAIL_HOST:smtp.gmail.com}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope: openid,email,profile
                        # redirect_uri mặc định của Spring Security: /login/oauth2/code/google
                        # -> phải khai đúng URI này trong Google Cloud Console.

# Token ký RSA (khóa sinh runtime ở KeyConfig) — không còn secret đối xứng.
jwt:
    # Thời hạn access token (giây) — mặc định 1 giờ.
    validDuration: ${JWT_VALID_DURATION:3600}
    # Thời hạn refresh token (giây) — mặc định 30 ngày. Refresh token lưu ở DB (hash), không phải JWT.
    refreshValidDuration: ${JWT_REFRESH_VALID_DURATION:2592000}

# Actuator: chỉ expose health/info/metrics. health công khai (SecurityConfig), phần còn
# lại đòi token. show-details when-authorized -> không lộ chi tiết DB cho request nặc danh.
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: when-authorized
            probes:
                enabled: true

app:
    # Timezone mặc định khi user chưa đặt (streak tính "hôm nay" theo giờ này).
    default-timezone: ${DEFAULT_TIMEZONE:Asia/Ho_Chi_Minh}
    # Web Push: private key BẮT BUỘC bí mật (secrets.properties/env). Rỗng -> tính năng push tắt.
    push:
        vapid-public-key: ${VAPID_PUBLIC_KEY:}
        vapid-private-key: ${VAPID_PRIVATE_KEY:}
        vapid-subject: ${VAPID_SUBJECT:mailto:admin@habit-tracker.local}
    # Nơi frontend nhận lại token sau khi đăng nhập Google xong (backend redirect tới đây kèm ?token=...).
    frontend-oauth2-redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    # Secure=true đòi HTTPS (localhost qua http vẫn được các trình duyệt hiện đại chấp nhận).
    # Đặt false CHỈ khi test qua http trên domain khác localhost — không dùng ở production.
    cookie-secure: ${COOKIE_SECURE:true}
    # Origin DUY NHẤT được phép gọi API kèm cookie (CORS). KHÔNG được để "*" vì
    # trình duyệt chặn credentials:'include' đi kèm wildcard origin.
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    # Chống brute-force endpoint auth: token bucket theo IP. capacity = số lần cho phép dồn;
    # refill-per-minute = tốc độ hồi. Mặc định 5 lần, hồi 5/phút (~1 lần mỗi 12s).
    rate-limit:
        auth:
            capacity: ${AUTH_RATE_CAPACITY:5}
            refill-per-minute: ${AUTH_RATE_REFILL_PER_MINUTE:5}
        cleanup-ms: ${RATE_LIMIT_CLEANUP_MS:600000}
    # Đặt lại mật khẩu: token hạn 30 phút; link-base là trang FE nhận token.
    password-reset:
        token-ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:1800}
        link-base: ${PASSWORD_RESET_LINK_BASE:${app.frontend-origin}/reset-password}
    # Xác thực email: token hạn 24 giờ; link-base là trang FE nhận token.
    email-verification:
        token-ttl-seconds: ${EMAIL_VERIFY_TTL_SECONDS:86400}
        link-base: ${EMAIL_VERIFY_LINK_BASE:${app.frontend-origin}/verify-email}
    # Đồng bộ 1 chiều habit -> Google Calendar. TẮT mặc định; bật khi đã cấu hình Google Cloud
    # (Calendar API + scope calendar.events + redirect-uri callback). client-id/secret dùng lại
    # của Google login. state-secret ký chống giả mạo userId lúc callback -> ĐẶT bí mật ở prod.
    google-calendar:
        enabled: ${GOOGLE_CALENDAR_ENABLED:false}
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/calendar/callback}
        state-secret: ${GOOGLE_CALENDAR_STATE_SECRET:dev-calendar-state-secret}
        event-duration-minutes: ${GOOGLE_CALENDAR_EVENT_DURATION:30}
