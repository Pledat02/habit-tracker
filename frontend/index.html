<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="Habit Tracker — xây dựng và duy trì thói quen tốt qua check-in hàng ngày, streak và thống kê trực quan." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Habit Tracker</title>
    <!-- Prevent dark-mode flash: apply saved theme before paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ht-theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
